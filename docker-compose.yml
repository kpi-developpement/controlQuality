services:
  backend:
    container_name: my-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/KyntusCQ
      JWT_SECRET: your_secret_here
      RECORDINGS_MODE: mysql
      DB_HOST: 10.10.10.55
      DB_PORT: 3306
      DB_NAME: enregistrement_audio
      DB_USER: kpi
      DB_PASSWORD: "${DB_PASSWORD}"
      PICKING_AUDIO_DIR: /app/audio_mails
      AUDIO_BASE_PATH: /app/audio_mails
    depends_on:
      - mongo
    volumes:
      - /mnt/nas_enrg/audio_mails:/app/audio_mails:ro
    networks:
      - internal_net
  frontend:
    container_name: my-frontend
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - internal_net
  mongo:
    image: mongo:4.4
    container_name: mongo-db
    restart: always
    volumes:
      - mongo-data:/data/db
    networks:
      - internal_net
networks:
  internal_net:
    driver: bridge
volumes:
  mongo-data:
