# KCQ — déploiement serveur (backend + frontend + MongoDB)
#
# Mise à jour (la base et les fichiers déposés sont conservés) :
#   cd ~ && rm -rf controlQuality && git clone https://github.com/kpi-developpement/controlQuality.git
#   cd controlQuality
#   docker compose down
#   docker compose up -d --build
# (toujours « docker compose » avec un espace : « docker-compose » est l'ancienne version 1, incompatible)
#
# Ne JAMAIS lancer « docker compose down -v » : -v supprime la base de données.
#
# Configuration + secrets (hors dépôt Git) : fichier ~/kcq.env de l'utilisateur qui lance Docker
# (autre chemin : variable KCQ_ENV_FILE). Modèle : .env.example à la racine du dépôt.
# Le frontend appelle le backend sur la même adresse que la page, port 5000 (rien à configurer).
# Pour forcer une autre adresse, exporter avant « up » : export VITE_API_URL=http://hote:5000/api VITE_API_BASE_URL=http://hote:5000

# Nom de projet fixe (= projet déjà en place sur le serveur) : mêmes conteneurs, réseau et volumes
# quel que soit le nom du dossier cloné
name: controlquality

services:
  backend:
    container_name: my-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ${KCQ_ENV_FILE:-${HOME}/kcq.env}
    # Toute la configuration (MONGO_URI, JWT_SECRET, MySQL des enregistrements…) vient de ~/kcq.env
    environment:
      NODE_ENV: production
      PORT: 5000
    depends_on:
      - mongo
    volumes:
      - /mnt/nas_enrg/audio_mails:/app/audio_mails:ro
      # Vidéos / fichiers des formations : conservés entre les mises à jour
      - kcq-uploads:/app/uploads
    networks:
      - internal_net

  frontend:
    container_name: my-frontend
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - internal_net

  mongo:
    image: mongo:4.4
    container_name: mongo-db
    restart: always
    volumes:
      - mongo-data:/data/db
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  # Noms fixes = les volumes déjà présents sur le serveur (la base actuelle est réutilisée)
  mongo-data:
    name: controlquality_mongo-data
  kcq-uploads:
    name: controlquality_uploads
